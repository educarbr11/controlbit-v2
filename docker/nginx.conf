server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # Assets versionados (hash no nome do arquivo) — cache agressivo.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: a navegação (@react-navigation) é toda client-side, então
    # qualquer rota não encontrada como arquivo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
