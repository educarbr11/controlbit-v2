name: iOS App Store
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx expo prebuild -p ios --no-install
      - run: cd ios && pod install

      - name: Chave da API
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          F=~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          # Aceita o .p8 em texto puro ou em base64
          if [[ "$KEY" == *"BEGIN PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" > $F; else echo "$KEY" | base64 -d > $F; fi
          openssl pkey -in $F -noout || { echo "::error::ASC_KEY_P8 inválido: cole o conteúdo do .p8 (texto puro ou base64)"; exit 1; }

      # A Apple rejeita build number repetido
      - name: Build number
        run: cd ios && agvtool new-version -all ${{ github.run_number }}

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -workspace controlbit.xcworkspace -scheme controlbit \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic

      - name: Exportar e enviar
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
