name: iOS App Store
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Expo 56 exige Swift 6.2 (Xcode 26); o padrão do runner é o 16.4
      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx expo prebuild -p ios --no-install
      - run: cd ios && pod install

      - name: Chave da API
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          F=~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          # Aceita o .p8 em texto puro ou base64, mesmo sem quebras de linha
          [[ "$KEY" == *"BEGIN"* ]] || KEY=$(echo "$KEY" | base64 -d)
          BODY=$(echo "$KEY" | sed -E 's/-----[A-Z ]+-----//g' | tr -d ' \r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w64; echo "-----END PRIVATE KEY-----"; } > $F
          openssl pkey -in $F -noout || { echo "::error::ASC_KEY_P8 inválido ou truncado: recole o conteúdo completo do .p8"; exit 1; }

      # A Apple rejeita build number repetido
      - name: Build number
        run: cd ios && agvtool new-version -all ${{ github.run_number }}

      # Archive sem assinar: o archive automático exige um iPhone cadastrado (perfil de desenvolvimento).
      # A assinatura de distribuição é feita no export, via chave da API.
      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -workspace controlbit.xcworkspace -scheme controlbit \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Exportar e enviar
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
